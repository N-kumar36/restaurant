services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: restaurant_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-restaurant_root_password}
      MYSQL_DATABASE: ${DB_NAME:-restaurant_db}
      MYSQL_USER: ${DB_USER:-restaurant_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-restaurant_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express + Socket.IO Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://restaurant_user:restaurant_password@mysql:3306/restaurant_db
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_restaurant_2026_prod}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_sample}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_secret}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  # Next.js Frontend Application
  frontend:
    build:
      context: ./portfolio-qrbase
      dockerfile: Dockerfile
    container_name: restaurant_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://backend:5000
    ports:
      - "3000:3000"

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local

